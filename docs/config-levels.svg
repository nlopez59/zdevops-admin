<svg xmlns="http://www.w3.org/2000/svg" width="730" height="340" viewBox="0 0 730 340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Desktop and z/OS configuration levels</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="730" height="340" fill="#ffffff"/>

  <!-- Desktop group label -->
  <text x="20" y="24" font-size="13" font-weight="bold" fill="#57606a">VS Code desktop configuration</text>

  <!-- Shared -->
  <rect x="20" y="36" width="190" height="90" rx="6" fill="#f7f8fa" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="115" y="64" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">Shared configuration</text>
  <text x="115" y="88" font-size="12" fill="#57606a" text-anchor="middle">Centrally distributed</text>
  <text x="115" y="105" font-size="12" fill="#57606a" text-anchor="middle">standards</text>

  <!-- Workspace -->
  <rect x="240" y="36" width="190" height="90" rx="6" fill="#f7f8fa" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="335" y="64" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">Workspace settings</text>
  <text x="335" y="88" font-size="12" fill="#57606a" text-anchor="middle">Application or team</text>
  <text x="335" y="105" font-size="12" fill="#57606a" text-anchor="middle">.vscode/settings.json</text>

  <!-- User -->
  <rect x="520" y="36" width="190" height="90" rx="6" fill="#f7f8fa" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="615" y="64" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">User settings</text>
  <text x="615" y="88" font-size="12" fill="#57606a" text-anchor="middle">Personal preferences</text>
  <text x="615" y="105" font-size="12" fill="#57606a" text-anchor="middle">settings.json</text>

  <!-- Workspace overrides User -->
  <line x1="432" y1="81" x2="518" y2="81" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="475" y="71" font-size="12" fill="#57606a" text-anchor="middle">overrides</text>

  <!-- Bracket under Shared + Workspace: reference templates in central repositories -->
  <path d="M20,134 L20,144 L430,144 L430,134" fill="none" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="225" y="164" font-size="12" fill="#57606a" text-anchor="middle">Maintain as reference templates in central repositories</text>

  <!-- z/OS host -->
  <text x="20" y="204" font-size="13" font-weight="bold" fill="#57606a">z/OS host</text>
  <rect x="20" y="214" width="690" height="64" rx="6" fill="#ffffff" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="365" y="240" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">z/OS host configuration</text>
  <text x="365" y="262" font-size="12" fill="#57606a" text-anchor="middle">Non-VS Code settings, managed separately according to each product's requirements</text>

  <!-- Footnote -->
  <text x="20" y="308" font-size="12" fill="#57606a">Workspace settings override User settings. Administrator policies may override both.</text>
  <text x="20" y="326" font-size="12" fill="#57606a">Shared configuration and z/OS host settings follow product-specific rules.</text>
</svg>
