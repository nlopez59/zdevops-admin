name: "sample-app"
description: | 
  This is a sample IBM Z Open Editor zapp.yaml for DBB V3. 
  

version: "3.0.0"
author:
  name: "ANY_NAME"


profiles:
- name: "dbb-userbuild"
  type: "dbb"
  settings:    
    # assumes $ZDEVOPS_HOME  is defined in /etc/profile  and set to /u/?/zdevops
    #         $DBB_BUILD = $ZDEVOPS_HOME/build   
    command: ". /etc/profile;   \
              mkdir -p conf; \
              cp -r conf/* $ZDEVOPS_HOME/conf; \                
              dbb  -DBB_DAEMON_PORT 8180 --verbose  build "

    lifecycle: "user"
    lifecycleArgs:
    - "--hlq ${zopeneditor.userbuild.userSettings.dbbHlq}"
    
    additionalDependencies:
    - "dbb-app.yaml"
    

    logFilePatterns:
    - "**/logs/*.log"   
    


propertyGroups:
- name: cobol-copybooks
  language: cobol
  libraries:
    - name: syslib
      type: local
      locations:
        - "**/copybook"
      
    